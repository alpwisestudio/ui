name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing (OIDC): no npm token stored in the repository.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14: Node 24 ships npm 11.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: npm >= 11.5.1
        run: |
          npm --version
          npx --yes semver -r '>=11.5.1' "$(npm --version)"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # Con changeset in sospeso apre/aggiorna la PR "Version Packages";
      # senza (cioè dopo il merge di quella PR) pubblica su npmjs.com.
      # Nessun NPM_TOKEN: l'action usa l'OIDC di GitHub (trusted publisher configurato
      # sul pacchetto, workflow release.yml). Il repo è pubblico, npm aggiunge la provenance.
      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
